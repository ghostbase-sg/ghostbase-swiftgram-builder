name: Jerkgram 12.9.2 Build134

on:
  workflow_dispatch:
  push:
    branches:
      - Jerkgram-12.9.2

concurrency:
  group: jerkgram-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-probe:
    runs-on: macos-26

    env:
      USE_BAZEL_VERSION: 8.4.2
      BAZEL_BIN: bazelisk
      CERT_B64: ${{ secrets.CERT_B64 }}
      PROF_B64: ${{ secrets.PROF_B64 }}
      P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
      KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
      JERKGRAM_TELEGRAM_API_ID: ${{ secrets.JERKGRAM_TELEGRAM_API_ID }}
      JERKGRAM_TELEGRAM_API_HASH: ${{ secrets.JERKGRAM_TELEGRAM_API_HASH }}

    steps:
      - name: Checkout builder
        uses: actions/checkout@v4

      - name: Install Bazelisk
        run: |
          set -e
          if ! command -v bazelisk >/dev/null 2>&1; then
            brew install bazelisk
          fi
          bazelisk --version || true

      - name: Prepare clean Official Telegram source
        run: |
          set -e
          chmod +x scripts/prepare_source_official.sh
          scripts/prepare_source_official.sh

      - name: Apply legacy compatibility baseline
        run: |
          set -e
          python3 scripts/apply_ghostbase_v10q_sh2_ot2_combined.py

      - name: Build Jerkgram
        run: |
          set -e

          # Current release-line Python must at least parse before touching the
          # materialized Official source. Historical 115-122 hooks are the same
          # chain that already produced Build123 and are exercised below.
          python3 -m py_compile \
            scripts/apply_jerkgram_v12l_build123_state_runtime1.py \
            scripts/apply_jerkgram_v12l_build123_message_fidelity1.py \
            scripts/apply_jerkgram_v12l_build123_profile_ui1.py \
            scripts/apply_jerkgram_v12l_build123_settings_ui1.py \
            scripts/verify_jerkgram_v12l_build123_release_recovery1.py \
            scripts/install_jerkgram_v12l_build123_probe_hook.py \
            scripts/apply_jerkgram_build124_telegram_api_credentials1.py \
            scripts/verify_jerkgram_build124_telegram_api_credentials1.py \
            scripts/verify_jerkgram_build124_telegram_api_ipa1.py \
            scripts/install_jerkgram_build124_telegram_api_probe_hook1.py \
            scripts/apply_jerkgram_v12m_build124_profile_edit_glass1.py \
            scripts/verify_jerkgram_v12m_build124_profile_edit_glass1.py \
            scripts/apply_jerkgram_v12m_build124_profile_more1.py \
            scripts/verify_jerkgram_v12m_build124_profile_more1.py \
            scripts/apply_jerkgram_v12m_build124_links_glass1.py \
            scripts/verify_jerkgram_v12m_build124_links_glass1.py \
            scripts/apply_jerkgram_v12m_build124_single_forward1.py \
            scripts/verify_jerkgram_v12m_build124_single_forward1.py \
            scripts/apply_jerkgram_v12m_build124_sensitive_settings1.py \
            scripts/verify_jerkgram_v12m_build124_sensitive_settings1.py \
            scripts/apply_jerkgram_v12m_build124_archive_import_runtime1.py \
            scripts/verify_jerkgram_v12m_build124_archive_import_runtime1.py \
            scripts/apply_jerkgram_v12m_build124_archive_export_runtime1.py \
            scripts/verify_jerkgram_v12m_build124_archive_export_runtime1.py \
            scripts/apply_jerkgram_v12m_build124_protected_forward1.py \
            scripts/verify_jerkgram_v12m_build124_protected_forward1.py \
            scripts/apply_jerkgram_v12m_build124_deleted_entities1.py \
            scripts/verify_jerkgram_v12m_build124_deleted_entities1.py \
            scripts/apply_jerkgram_v12m_build124_edit_history1.py \
            scripts/verify_jerkgram_v12m_build124_edit_history1.py \
            scripts/apply_jerkgram_v12m_build124_auth_keyboard1.py \
            scripts/verify_jerkgram_v12m_build124_auth_keyboard1.py \
            scripts/apply_jerkgram_v12m_build124_bot_localization1.py \
            scripts/verify_jerkgram_v12m_build124_bot_localization1.py \
            scripts/apply_jerkgram_v12m_build124_lifecycle_freeze1.py \
            scripts/verify_jerkgram_v12m_build124_lifecycle_freeze1.py \
            scripts/apply_jerkgram_v12m_build124_onetime_persistence1.py \
            scripts/verify_jerkgram_v12m_build124_onetime_persistence1.py \
            scripts/apply_jerkgram_v12m_build124_onetime_viewed1.py \
            scripts/verify_jerkgram_v12m_build124_onetime_viewed1.py \
            scripts/apply_jerkgram_v12m_build124_settings_redesign1.py \
            scripts/verify_jerkgram_v12m_build124_settings_redesign1.py \
            scripts/apply_jerkgram_v12n_build125_profile_edit1.py \
            scripts/verify_jerkgram_v12n_build125_profile_edit1.py \
            scripts/apply_jerkgram_v12n_build125_single_forward1.py \
            scripts/verify_jerkgram_v12n_build125_single_forward1.py \
            scripts/apply_jerkgram_v12n_build125_circle_viewed1.py \
            scripts/verify_jerkgram_v12n_build125_circle_viewed1.py \
            scripts/apply_jerkgram_v12n_build125_links_bounds1.py \
            scripts/verify_jerkgram_v12n_build125_links_bounds1.py \
            scripts/apply_jerkgram_v12n_build125_protected_cache1.py \
            scripts/verify_jerkgram_v12n_build125_protected_cache1.py \
            scripts/apply_jerkgram_v12n_build125_auth_ghost_localization1.py \
            scripts/verify_jerkgram_v12n_build125_auth_ghost_localization1.py \
            scripts/install_jerkgram_v12n_build125_probe_hook.py \
            scripts/verify_jerkgram_v12n_build125_wiring1.py \
            scripts/install_jerkgram_v12m_build124_probe_hook.py \
            scripts/verify_jerkgram_v12m_build124_wiring1.py \
            scripts/jerkgram_finalize_build125_identity.py \
            scripts/verify_jerkgram_v12n_build125_final_ipa.py \
            scripts/jerkgram_publish_build125_artifact.py \
            scripts/apply_jerkgram_v12o_build126_bio_corner_mask1.py \
            scripts/apply_jerkgram_v12o_build126_voice_viewed_state1.py \
            scripts/apply_jerkgram_v12o_build126_circle_viewed_state1.py \
            scripts/apply_jerkgram_v12o_build126_forward_menu_owner1.py \
            scripts/apply_jerkgram_v12p_build127_onetime_native_status1.py \
            scripts/apply_jerkgram_v12q_build128_bio_corner_owner1.py \
            scripts/apply_jerkgram_v12r_build129_protected_chat_forward1.py \
            scripts/apply_jerkgram_v12s_build130_siri_failclosed1.py \
            scripts/verify_jerkgram_v12s_build130_siri_failclosed1.py \
            scripts/install_jerkgram_v12s_build130_probe_hook.py \
            scripts/jerkgram_finalize_build126_keychain_package1.py \
            scripts/jerkgram_finalize_build128_file_picker_package1.py \
            scripts/jerkgram_finalize_build128_identity.py \
            scripts/verify_jerkgram_v12s_build128_final_ipa.py \
            scripts/jerkgram_finalize_build130_identity.py \
            scripts/verify_jerkgram_v12s_build130_final_ipa.py \
            scripts/jerkgram_publish_build130_artifact.py \
            scripts/apply_jerkgram_v12t_build133_blocked_reactions1.py \
            scripts/verify_jerkgram_v12t_build133_blocked_reactions1.py \
            scripts/apply_jerkgram_v12u_build133_blocked_activity1.py \
            scripts/verify_jerkgram_v12u_build133_blocked_activity1.py \
            scripts/apply_jerkgram_v12v_build133_settings1.py \
            scripts/verify_jerkgram_v12v_build133_settings1.py \
            scripts/apply_jerkgram_v12w_build133_music_overlay1.py \
            scripts/verify_jerkgram_v12w_build133_music_overlay1.py \
            scripts/install_jerkgram_v12w_build133_probe_hook.py \
            scripts/jerkgram_finalize_build133_identity.py \
            scripts/verify_jerkgram_v12w_build133_final_ipa.py \
            scripts/jerkgram_publish_build133_artifact.py

          # Preserve the established late-release regression gates.
          python3 -m unittest tests.test_jerkgram_v12h_build119_hybrid_ui1
          python3 -m unittest tests.test_jerkgram_v12i_build120_profile_blur_lifecycle1
          python3 -m unittest tests.test_jerkgram_v12j_build121_sticker_recovery1
          python3 -m unittest tests.test_jerkgram_v12k_build122_reply_sticker_contract1
          python3 -m unittest tests.test_jerkgram_v12k_build122_edit_caption_history1
          python3 -m unittest tests.test_jerkgram_v12k_build122_settings_release1
          python3 -m unittest tests.test_jerkgram_v12l_build123_release_recovery1

          # Build124 RED->GREEN contracts. These exercise patch functions only;
          # materialized-source verifiers execute inside the probe before Bazel.
          python3 -m unittest tests.test_jerkgram_build124_telegram_api_credentials1
          python3 -m unittest tests.test_jerkgram_build124_telegram_api_probe_hook1
          python3 -m unittest tests.test_jerkgram_build124_telegram_api_source_owner1
          python3 -m unittest tests.test_jerkgram_v12m_build124_final_ipa_credentials1
          python3 -m unittest tests.test_jerkgram_v12m_build124_final_ipa_wiring1
          python3 -m unittest tests.test_jerkgram_v12n_build125_canary_publication1
          python3 -m unittest tests.test_jerkgram_v12m_build124_profile_edit_glass1
          python3 -m unittest tests.test_jerkgram_v12m_build124_profile_more1
          python3 -m unittest tests.test_jerkgram_v12m_build124_links_glass1
          python3 -m unittest tests.test_jerkgram_v12m_build124_single_forward1
          python3 -m unittest tests.test_jerkgram_v12m_build124_sensitive_settings1
          python3 -m unittest tests.test_jerkgram_v12m_build124_archive_import_runtime1
          python3 -m unittest tests.test_jerkgram_v12m_build124_archive_import_refresh1
          python3 -m unittest tests.test_jerkgram_v12m_build124_archive_export_runtime1
          python3 -m unittest tests.test_jerkgram_v12m_build124_protected_forward1
          python3 -m unittest tests.test_jerkgram_v12m_build124_deleted_entities1
          python3 -m unittest tests.test_jerkgram_v12m_build124_edit_history1
          python3 -m unittest tests.test_jerkgram_v12m_build124_auth_keyboard1
          python3 -m unittest tests.test_jerkgram_v12m_build124_bot_localization1
          python3 -m unittest tests.test_jerkgram_v12m_build124_lifecycle_freeze1
          python3 -m unittest tests.test_jerkgram_v12m_build124_onetime_persistence1
          python3 -m unittest tests.test_jerkgram_v12m_build124_onetime_viewed1
          python3 -m unittest tests.test_jerkgram_v12m_build124_settings_redesign1
          python3 -m unittest tests.test_jerkgram_v12m_build124_wiring1
          python3 -m unittest tests.test_jerkgram_v12n_build125_profile_edit1
          python3 -m unittest tests.test_jerkgram_v12n_build125_single_forward1
          python3 -m unittest tests.test_jerkgram_v12n_build125_circle_viewed1
          python3 -m unittest tests.test_jerkgram_v12n_build125_links_bounds1
          python3 -m unittest tests.test_jerkgram_v12n_build125_protected_cache1
          python3 -m unittest tests.test_jerkgram_v12n_build125_auth_ghost_localization1
          python3 -m unittest tests.test_jerkgram_v12n_build125_wiring1
          python3 -m unittest tests.test_jerkgram_v12o_build126_bot_token_wiring1
          python3 -m unittest tests.test_jerkgram_v12o_build126_bio_corner_mask1
          python3 -m unittest tests.test_jerkgram_v12o_build126_voice_viewed_state1
          python3 -m unittest tests.test_jerkgram_v12o_build126_circle_viewed_state1
          python3 -m unittest tests.test_jerkgram_v12o_build126_forward_menu_owner1
          python3 -m unittest tests.test_jerkgram_v12p_build127_onetime_native_status1
          python3 -m unittest tests.test_jerkgram_v12q_build128_bio_corner_owner1
          python3 -m unittest tests.test_jerkgram_v12r_build129_protected_chat_forward1
          python3 -m unittest tests.test_jerkgram_v12s_build130_siri_failclosed1
          python3 -m unittest tests.test_jerkgram_v12s_build128_file_picker_package1
          python3 -m unittest tests.test_jerkgram_v12o_build126_keychain_packaging1
          python3 -m unittest tests.test_jerkgram_v12o_build126_release_contract1

          # Build133 runtime-repair contracts. Materialized owner verifiers run
          # again from the probe immediately before Bazel.
          python3 -m unittest tests.test_jerkgram_v12t_build133_blocked_reactions1
          python3 -m unittest tests.test_jerkgram_v12u_build133_blocked_activity1
          python3 -m unittest tests.test_jerkgram_v12v_build133_settings1
          python3 -m unittest tests.test_jerkgram_v12w_build133_music_overlay1
          python3 -m unittest tests.test_jerkgram_v12x_build133_release_ui1
          python3 -m unittest tests.test_jerkgram_v12y_build133_telemetry2
          python3 -m unittest tests.test_jerkgram_build134_release_contract

          # Canonical materialization chain. The legacy-named root installer delegates
          # to Build130/Build125, then appends v12t/v12u/v12v/v12w before Bazel.
          python3 scripts/install_jerkgram_v12d_build115_probe_hook.py
          python3 scripts/install_jerkgram_v12e_build116_probe_hook.py
          python3 scripts/install_jerkgram_v12f_build117_probe_hook.py
          python3 scripts/install_jerkgram_v12g_build118_probe_hook.py
          python3 scripts/install_jerkgram_v12h_build119_probe_hook.py
          python3 scripts/install_jerkgram_v12i_build120_probe_hook.py
          python3 scripts/install_jerkgram_v12j_build121_probe_hook.py
          python3 scripts/install_jerkgram_v12k_build122_probe_hook.py
          python3 scripts/install_jerkgram_v12w_build133_probe_hook.py
          python3 scripts/verify_jerkgram_v12m_build124_wiring1.py
          python3 scripts/verify_jerkgram_v12n_build125_wiring1.py

          chmod +x scripts/bazel_build_probe_official.sh
          scripts/bazel_build_probe_official.sh

      - name: Upload materialized Build133 diagnostic owners
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Build133-materialized-owner-diagnostics
          path: |
            work/swiftgram-src/submodules/TelegramCore/Sources/TelegramEngine/Messages/MarkMessageContentAsConsumedInteractively.swift
            work/swiftgram-src/submodules/TelegramCore/Sources/State/ManagedAutoremoveMessageOperations.swift
            work/swiftgram-src/submodules/TelegramCore/Sources/State/AccountStateManagementUtils.swift
            work/swiftgram-src/submodules/TelegramUI/Sources/ChatInterfaceStateContextMenus.swift
            work/swiftgram-src/submodules/TelegramUI/Sources/AppDelegate.swift
            work/swiftgram-src/submodules/JerkgramCore/Sources/JerkgramStore.swift
            work/swiftgram-src/submodules/TelegramUI/Components/Chat/ChatMessageInteractiveFileNode/Sources/ChatMessageInteractiveFileNode.swift
            work/swiftgram-src/submodules/TelegramUI/Components/Chat/ChatMessageInteractiveMediaNode/Sources/ChatMessageInteractiveMediaNode.swift
            work/swiftgram-src/submodules/SettingsUI/Sources/GhostBase/GhostBaseSettingsController.swift
            work/swiftgram-src/submodules/SettingsUI/Sources/Jerkgram/JerkgramStarsEditorController.swift
            work/swiftgram-src/submodules/SettingsUI/Sources/Jerkgram/JerkgramDataAndBackupController.swift
            work/swiftgram-src/submodules/TelegramUI/Components/Chat/ChatSearchNavigationContentNode/Sources/JerkgramTimeMachineController.swift
            work/swiftgram-src/submodules/TelegramPresentationData/Sources/JerkgramStrings.swift
            work/swiftgram-src/submodules/TelegramCore/Sources/ApiUtils/ReactionsMessageAttribute.swift
            work/swiftgram-src/submodules/TelegramCore/Sources/State/MessageReactions.swift
            work/swiftgram-src/submodules/TelegramCore/Sources/TelegramEngine/Privacy/BlockedPeersContext.swift
            work/swiftgram-src/submodules/TelegramCore/Sources/ApiUtils/StoreMessage_Telegram.swift
            work/swiftgram-src/submodules/TelegramCore/Sources/State/AccountViewTracker.swift
            work/swiftgram-src/submodules/TelegramCore/Sources/TelegramEngine/Messages/DeleteMessages.swift
            work/swiftgram-src/submodules/TelegramCore/Sources/TelegramEngine/Messages/ChatList.swift
            work/swiftgram-src/submodules/TelegramCore/Sources/TelegramEngine/Messages/EarliestUnseenPersonalMentionMessage.swift
            work/swiftgram-src/submodules/TelegramUI/Sources/OverlayAudioPlayerController.swift
            work/swiftgram-src/submodules/TelegramUI/Sources/OverlayAudioPlayerControllerNode.swift
          if-no-files-found: warn

      - name: Publish Jerkgram Build134 artifact
        if: success()
        run: |
          set -e
          python3 scripts/jerkgram_publish_build133_artifact.py

      - name: Upload Jerkgram Build134
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Jerkgram-Build134
          path: |
            artifacts/Jerkgram-Build134.ipa
            artifacts/Jerkgram-Build134-info.txt
          if-no-files-found: error
