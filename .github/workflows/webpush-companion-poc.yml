name: Jerkgram Web Push Companion PoC

on:
  workflow_dispatch:
  push:
    branches:
      - dev/webpush-companion-poc
    paths:
      - "webpush-companion/**"
      - "tests/webpush_handoff_test.mjs"
      - "tests/test_webk_jerkgram_push_patch.py"
      - "tests/test_webk_jerkgram_pairing_v01.py"
      - "tests/test_webk_jerkgram_branding_v01.py"
      - "tests/test_webk_companion_package_v01.py"
      - "tests/test_webk_companion_shell_v01.py"
      - "tests/test_webk_jerkgram_privacy_v01.py"
      - "tests/test_jerkgram_push_click_bridge_v01.py"
      - "tests/test_jerkgram_push_pairing_bridge_v01.py"
      - "scripts/apply_jerkgram_push_click_bridge_v01.py"
      - "scripts/apply_jerkgram_push_pairing_bridge_v01.py"
      - "scripts/verify_jerkgram_push_click_bridge_v01.py"
      - ".github/workflows/webpush-companion-poc.yml"

permissions:
  contents: read

jobs:
  static-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Jerkgram builder
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install pytest
        run: python -m pip install --disable-pip-version-check pytest

      - name: Test handoff parser
        run: node tests/webpush_handoff_test.mjs

      - name: Test bounded patchers and packaging
        run: >-
          pytest -q
          tests/test_webk_jerkgram_push_patch.py
          tests/test_webk_jerkgram_pairing_v01.py
          tests/test_webk_jerkgram_branding_v01.py
          tests/test_webk_companion_package_v01.py
          tests/test_webk_companion_shell_v01.py
          tests/test_webk_jerkgram_privacy_v01.py
          tests/test_jerkgram_push_click_bridge_v01.py
          tests/test_jerkgram_push_pairing_bridge_v01.py

  webk-compile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Jerkgram builder
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Checkout pinned Telegram Web K
        run: |
          set -euxo pipefail
          git clone --recurse-submodules https://github.com/morethanwords/tweb.git tweb
          cd tweb
          git checkout e9428f2a90f73d750f16a0b85817820516466364
          git submodule update --init --recursive

      - name: Apply Jerkgram companion push patch
        run: python webpush-companion/apply_webk_jerkgram_push_v01.py "$GITHUB_WORKSPACE/tweb"

      - name: Apply Jerkgram companion one-tap pairing patch
        run: python webpush-companion/apply_webk_jerkgram_pairing_v01.py "$GITHUB_WORKSPACE/tweb"

      - name: Apply isolated companion branding
        run: python webpush-companion/apply_webk_jerkgram_branding_v01.py "$GITHUB_WORKSPACE/tweb"

      - name: Apply notification-only companion UI
        run: python webpush-companion/apply_webk_jerkgram_minimal_ui_v01.py "$GITHUB_WORKSPACE/tweb"

      - name: Apply push privacy hardening
        run: python webpush-companion/apply_webk_jerkgram_privacy_v01.py "$GITHUB_WORKSPACE/tweb"

      - name: Install Web K dependencies
        working-directory: tweb
        run: |
          corepack enable
          corepack prepare pnpm@11.16.0 --activate
          pnpm install --frozen-lockfile

      - name: Typecheck patched Web K
        working-directory: tweb
        run: pnpm run typecheck

      - name: Build patched Web K
        working-directory: tweb
        run: pnpm exec vite build

      - name: Package notification-only PWA assets
        run: python webpush-companion/package_webk_dist_v01.py "$GITHUB_WORKSPACE/tweb"

      - name: Verify deployable companion
        shell: bash
        run: |
          set -euo pipefail
          test -f tweb/dist/open.html
          test -f tweb/dist/handoff.js
          test -f tweb/dist/site.webmanifest
          test -f tweb/dist/site_apple.webmanifest
          test -f tweb/dist/assets/img/apple-touch-icon.png
          test -f tweb/dist/assets/img/logo_filled_rounded.png
          test -f tweb/dist/assets/img/logo_plain.svg

          grep -q "jerkgram://push/open" tweb/dist/handoff.js
          grep -q '"name": "Jerkgram Notifications"' tweb/dist/site.webmanifest
          grep -q '<title>Jerkgram Notifications</title>' tweb/dist/index.html
          grep -R -q "Connect with Jerkgram" tweb/dist/*.js
          grep -R -q "jerkgram://push/authorize" tweb/dist/*.js
          grep -R -q "Enable Notifications" tweb/dist/*.js
          grep -R -q "Add Jerkgram Notifications to the Home Screen" tweb/dist/*.js

          if grep -I -n 'web.telegram.org' tweb/dist/index.html tweb/dist/site*.webmanifest; then
            echo "Telegram Web origin leaked into deployable metadata" >&2
            exit 1
          fi
          if grep -I -n 'https://t.me\|https://telegram.me' tweb/dist/site*.webmanifest; then
            echo "Telegram scope extension leaked into companion manifest" >&2
            exit 1
          fi
          if find tweb/dist -type f -name '*.map' -print -quit | grep -q .; then
            echo "Source map leaked into deployable companion" >&2
            exit 1
          fi
          for forbidden in assets/emoji assets/tgs assets/audio assets/img/screenshot.jpg; do
            if test -e "tweb/dist/$forbidden"; then
              echo "Forbidden Web K asset leaked: $forbidden" >&2
              exit 1
            fi
          done

          python - <<'PY'
          from pathlib import Path
          root = Path('tweb/dist')
          files = [p for p in root.rglob('*') if p.is_file()]
          total = sum(p.stat().st_size for p in files)
          print(f"deployable files={len(files)} bytes={total}")
          if len(files) > 500:
              raise SystemExit(f"too many files for notification-only companion: {len(files)}")
          if total > 20 * 1024 * 1024:
              raise SystemExit(f"notification-only companion unexpectedly large: {total} bytes")
          PY

      - name: Upload Jerkgram Notifications Alpha
        uses: actions/upload-artifact@v4
        with:
          name: jerkgram-notifications-0.1-alpha
          path: tweb/dist
          if-no-files-found: error
          compression-level: 9
