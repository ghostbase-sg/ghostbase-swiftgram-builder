name: Build139 Native Build Guard

on:
  workflow_dispatch:
  push:
    branches:
      - dev/build133-runtime-repair

concurrency:
  group: jerkgram-build139-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - name: Use existing native build pipeline
        run: |
          echo "The existing Build138 Integration Trigger dispatches the proven main build.yml on this branch."
          echo "This guard intentionally performs no second iOS/Bazel build."
