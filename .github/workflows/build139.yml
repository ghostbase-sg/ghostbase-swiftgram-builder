name: Build140 Native Build Guard

on:
  workflow_dispatch:
  push:
    branches:
      - dev/build133-runtime-repair

concurrency:
  group: jerkgram-build140-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - name: Use canonical native build pipeline
        run: |
          echo "Build140 Integration Trigger dispatches the proven main build.yml on this branch after preflight."
          echo "This guard intentionally performs no second iOS/Bazel build."
