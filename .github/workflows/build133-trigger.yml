name: Build136 Integration Trigger

on:
  push:
    branches:
      - dev/build133-runtime-repair

permissions:
  actions: write
  contents: read

jobs:
  dispatch-build136:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch main Build136 workflow on this branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          gh workflow run build.yml --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME"

# retrigger: Build136 visible ordering and cache
